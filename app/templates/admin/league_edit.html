{% extends "admin/base.html" %}
{% block title %}Edit League{% endblock %}

{% block content %}
<div class="page-header">
  <a href="/admin/leagues" class="back-link">← Leagues</a>
  <h2>Edit League</h2>
</div>

<section class="card" style="max-width:500px">
  <form method="post" action="/admin/leagues/{{ league.id }}/edit" class="settings-form">
    <div class="form-group">
      <label>League Name</label>
      <input type="text" name="name" required maxlength="100"
             value="{{ league.name }}" placeholder="My League">
    </div>
    <div style="display:flex;gap:.75rem;flex-wrap:wrap">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/admin/leagues" class="btn btn-secondary">Cancel</a>
      <button type="button" class="btn btn-danger" onclick="confirmDelete('Delete league {{ league.name }}? Members will remain registered.', '/admin/leagues/{{ league.id }}/delete')">Delete League</button>
    </div>
  </form>
</section>
{% endblock %}
