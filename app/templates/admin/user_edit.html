{% extends "admin/base.html" %}
{% block title %}Edit User{% endblock %}

{% block content %}
<div class="page-header">
  <a href="/admin/users" class="back-link">← Users</a>
  <h2>Edit User</h2>
</div>

<section class="card" style="max-width:500px">
  <form method="post" action="/admin/users/{{ user.id }}/edit" class="settings-form">
    <div class="form-row">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" name="first_name" maxlength="80"
               value="{{ user.first_name or '' }}" placeholder="Marko">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" name="last_name" maxlength="80"
               value="{{ user.last_name or '' }}" placeholder="Petrović">
      </div>
    </div>
    <div class="form-group">
      <label>Username <small>(used for login)</small></label>
      <input type="text" name="username" required maxlength="50"
             value="{{ user.username }}">
    </div>
    <div class="form-group">
      <label class="checkbox-label">
        <input type="checkbox" name="is_admin" value="1"
               {% if user.is_admin %}checked{% endif %}>
        Admin privileges
      </label>
    </div>
    <div style="display:flex;gap:.75rem;flex-wrap:wrap">
      <button type="submit" class="btn btn-primary">Save Changes</button>
      <a href="/admin/users" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
